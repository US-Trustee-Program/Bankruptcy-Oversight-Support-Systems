ignore:
  - test/e2e/fixtures/**
  # Manual local dev tooling, not reviewed/merged code paths - test/ui-sandbox/local.settings.json
  # contains only the well-known, publicly documented Azurite emulator storage key (also present
  # in test/e2e/local.settings.backend.json), not a real secret.
  - test/ui-sandbox/**

rules:
  - id: no-it-tests
    description: "Do not use 'it' in tests. Use 'test' instead."
    pattern: it(${name}, ${fn})
    replacement: test(${name}, ${fn})
    tests:
      - match: it("does something", fn)
        expect: test("does something", fn)
      - match: it("works", functionRef)
        expect: test("works", functionRef)
