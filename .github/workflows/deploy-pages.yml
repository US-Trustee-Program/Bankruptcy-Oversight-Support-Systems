name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  # Refreshes docs/operations/dora-metrics.md weekly without a commit. Runs whatever the DORA run's
  # conclusion; the fetch step picks the newest run that rendered a page.
  workflow_run:
    workflows: [DORA Metrics]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, skip runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions: read-all

jobs:
  build:
    # A fork PR's run can report head branch main, so workflow_run's branch filter alone would let it
    # trigger a build. Only this repo's scheduled or manually dispatched DORA runs may.
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name ==
      github.repository && (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      # The DORA Metrics run whose page was published; empty when the placeholder was served.
      dora_run_id: ${{ steps.fetch.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the page from the newest DORA Metrics run on main that rendered one, whatever the
      # run's overall conclusion, so a failed publish job doesn't hold back a good page. Only this
      # repo's scheduled or manually dispatched runs count: a fork PR's run can also report head
      # branch main, and its artifact must never reach the site. Serves the committed placeholder
      # only when there are no such runs. Any other failure (an API error after retries, no page
      # in the last 10 runs, a failed download or copy, a page containing HTML) fails the build,
      # so the published site, and its current page, stay as they are.
      - name: Fetch rendered DORA Metrics page
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          page=docs/operations/dora-metrics.md

          # Prints only the successful attempt's output: gh api writes its error JSON to stdout.
          retry() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$("$@"); then
                printf '%s' "${out}"
                return 0
              fi
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }

          if ! run_ids=$(retry gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/dora-metrics.yml/runs?branch=main&status=completed&per_page=50" \
              --jq "[.workflow_runs[]
                     | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\")
                     | select(.event == \"schedule\" or .event == \"workflow_dispatch\")][:10][].id"); then
            echo "::error::Could not list DORA Metrics runs; failing so the published site stays as it is."
            exit 1
          fi

          if [ -z "${run_ids}" ]; then
            echo "::warning::No scheduled or dispatched DORA Metrics run on main found; serving the placeholder page."
            exit 0
          fi

          for run_id in ${run_ids}; do
            if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected DORA Metrics run ID: ${run_id}"
              exit 1
            fi
            if ! pages=$(retry gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=dora-docs-page" \
                --jq '[.artifacts[] | select(.expired | not)] | length'); then
              echo "::error::Could not list artifacts for DORA Metrics run ${run_id}; failing so the published site stays as it is."
              exit 1
            fi
            if [[ ! "${pages}" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected artifact count for DORA Metrics run ${run_id}: ${pages}"
              exit 1
            fi
            [ "${pages}" -gt 0 ] || continue

            page_dir=$(mktemp -d)
            if ! retry gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
                --name dora-docs-page --dir "${page_dir}"; then
              echo "::error::Could not download the page from DORA Metrics run ${run_id}; failing so the published site stays as it is."
              exit 1
            fi
            # The renderer emits only numbers, dates and fixed text, so a real page never has a '<'.
            if grep -q '<' "${page_dir}/dora-metrics.md"; then
              echo "::error::The page from DORA Metrics run ${run_id} contains HTML; failing so the published site stays as it is."
              exit 1
            fi
            if [ ! -s "${page_dir}/dora-metrics.md" ] || ! cp "${page_dir}/dora-metrics.md" "${page}"; then
              echo "::error::Could not copy the page from DORA Metrics run ${run_id}; failing so the published site stays as it is."
              exit 1
            fi
            echo "Using the DORA Metrics page from run ${run_id}."
            echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
            exit 0
          done

          echo "::error::None of the last 10 DORA Metrics runs on main has an unexpired dora-docs-page artifact; failing so the published site stays as it is."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Posts the weekly DORA headline once the page it describes is live. Only for a build triggered by a
  # DORA Metrics run that published its own page: docs pushes and manual Pages runs never post, and a
  # build that fell back to an older run's page would post a stale week.
  post-headline:
    name: Post DORA headline to Slack
    needs: [build, deploy]
    if: >-
      github.event_name == 'workflow_run' && needs.build.outputs.dora_run_id == format('{0}',
      github.event.workflow_run.id)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Post headline
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.build.outputs.dora_run_id }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail

          retry() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$("$@"); then
                printf '%s' "${out}"
                return 0
              fi
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }

          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected DORA Metrics run ID: ${RUN_ID}"
            exit 1
          fi
          if [[ ! "${PAGE_URL}" =~ ^https://[^[:space:]\<\>\|]+/$ ]]; then
            echo "::error::Unexpected Pages URL: ${PAGE_URL}"
            exit 1
          fi

          if ! headlines=$(retry gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=dora-slack-headline" \
              --jq '[.artifacts[] | select(.expired | not)] | length'); then
            echo "::error::Could not list artifacts for DORA Metrics run ${RUN_ID}."
            exit 1
          fi
          # Runs from before the headline existed have no artifact; nothing to post.
          if [ "${headlines}" = "0" ]; then
            echo "::notice::DORA Metrics run ${RUN_ID} has no dora-slack-headline artifact; not posting."
            exit 0
          fi

          headline_dir=$(mktemp -d)
          if ! retry gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
              --name dora-slack-headline --dir "${headline_dir}"; then
            echo "::error::Could not download the headline from DORA Metrics run ${RUN_ID}."
            exit 1
          fi
          headline_file="${headline_dir}/dora-slack-headline.txt"
          if [ ! -s "${headline_file}" ]; then
            echo "::error::The headline from DORA Metrics run ${RUN_ID} is missing or empty."
            exit 1
          fi
          # The renderer emits only numbers, dates and fixed text. These characters would be Slack
          # links, mentions or escapes, so their presence means the file is not the renderer's.
          if grep -q '[<>&@]' "${headline_file}"; then
            echo "::error::The headline from DORA Metrics run ${RUN_ID} contains Slack markup; not posting."
            exit 1
          fi

          payload=$(jq -n --rawfile headline "${headline_file}" \
            --arg link "<${PAGE_URL}#/operations/dora-metrics|DORA Metrics page>" \
            '{text: (($headline | rtrimstr("\n")) + "\n" + $link)}')
          # Bounded so a stalled Slack call can't hold the pages concurrency group. --retry covers only
          # timeouts, 408, 429 and 5xx, so a post Slack accepted is not sent again.
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 --retry 3 \
            -X POST -H 'Content-type: application/json' \
            --data "${payload}" "${SLACK_WEBHOOK_URL}"
