name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  # Refreshes docs/operations/dora-metrics.md weekly without a commit. Runs whatever the DORA run's
  # conclusion; the fetch step picks the newest run that rendered a page.
  workflow_run:
    workflows: [DORA Metrics]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, skip runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses the page from the newest DORA Metrics run on main that rendered one, whatever the
      # run's overall conclusion, so a failed publish job doesn't hold back a good page. Serves
      # the committed placeholder only when no recent run has a page. Any other failure (an API
      # error after retries, a failed download or copy) fails the build, so the published site,
      # and its current page, stay as they are.
      - name: Fetch rendered DORA Metrics page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          page=docs/operations/dora-metrics.md

          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "${attempt}" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }

          if ! run_ids=$(retry gh run list --repo "${GITHUB_REPOSITORY}" --workflow dora-metrics.yml \
              --branch main --status completed --limit 10 --json databaseId --jq '.[].databaseId'); then
            echo "::error::Could not list DORA Metrics runs; failing so the published site stays as it is."
            exit 1
          fi

          for run_id in ${run_ids}; do
            if ! pages=$(retry gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=dora-docs-page" \
                --jq '[.artifacts[] | select(.expired | not)] | length'); then
              echo "::error::Could not list artifacts for DORA Metrics run ${run_id}; failing so the published site stays as it is."
              exit 1
            fi
            [ "${pages}" -gt 0 ] || continue

            page_dir=$(mktemp -d)
            if ! retry gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
                --name dora-docs-page --dir "${page_dir}"; then
              echo "::error::Could not download the page from DORA Metrics run ${run_id}; failing so the published site stays as it is."
              exit 1
            fi
            if [ ! -s "${page_dir}/dora-metrics.md" ] || ! cp "${page_dir}/dora-metrics.md" "${page}"; then
              echo "::error::Could not copy the page from DORA Metrics run ${run_id}; failing so the published site stays as it is."
              exit 1
            fi
            echo "Using the DORA Metrics page from run ${run_id}."
            exit 0
          done

          echo "::warning::None of the last 10 DORA Metrics runs on main has a dora-docs-page artifact; serving the placeholder page."

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
