name: Approve Renovate Auto-merge PRs
# test commit
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: renovate-auto-approve
  cancel-in-progress: false

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Approve eligible Renovate PRs
        env:
          GH_TOKEN: ${{ secrets.BOT_USTP_CODEOWNER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only one Renovate PR should be in flight (approved but not yet
          # merged) at a time, so a stale PR can't slip past main's
          # non-strict required status checks and merge alongside another.
          # Only counts PRs that are both approved and auto-merge-eligible, so
          # an unrelated approved PR (e.g. a major version bump a human
          # approved manually) can't block every future candidate.
          in_flight=$(gh pr list --repo "$REPO" --author "renovate[bot]" --state open \
            --json reviewDecision,autoMergeRequest \
            --jq '[.[] | select(.reviewDecision == "APPROVED" and .autoMergeRequest != null)] | length')

          if [ "$in_flight" -gt 0 ]; then
            echo "A previously approved Renovate PR is still open — waiting for it to merge before approving another."
            exit 0
          fi

          # Only candidates with no reviewer decision yet, or an outstanding
          # "review required" state — excludes both already-approved PRs and
          # ones where a human requested changes.
          candidates=$(gh pr list --repo "$REPO" --author "renovate[bot]" --state open \
            --json number,autoMergeRequest,reviewDecision \
            --jq '[.[] | select(.autoMergeRequest != null and (.reviewDecision == null or .reviewDecision == "REVIEW_REQUIRED")) | .number] | sort | .[]')

          for pr in $candidates; do
            # A status-check entry is either a CheckRun (status/conclusion) or
            # a legacy commit StatusContext (state); require at least one
            # entry so an empty rollup can't vacuously count as "passing".
            checks_ok=$(gh pr view "$pr" --repo "$REPO" --json statusCheckRollup --jq '
              (.statusCheckRollup | length > 0) and
              (.statusCheckRollup | map(
                if has("state") then .state == "SUCCESS"
                else .status == "COMPLETED" and (.conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL")
                end
              ) | all)
            ')

            if [ "$checks_ok" != "true" ]; then
              echo "PR #${pr} checks are not all passing yet — skipping."
              continue
            fi

            # Re-checked as late as possible, right before approval, to
            # minimize the window where main could advance underneath it.
            head_sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')
            behind_by=$(gh api "repos/${REPO}/compare/${head_sha}...main" --jq '.ahead_by')

            if [ "$behind_by" -ne 0 ]; then
              echo "PR #${pr} is ${behind_by} commit(s) behind main — skipping until Renovate rebases it."
              continue
            fi

            echo "Approving PR #${pr}"
            gh pr review "$pr" --repo "$REPO" --approve \
              --body "Auto-approved: up to date with main, checks passing, and no other Renovate PR currently in flight."
            break
          done
