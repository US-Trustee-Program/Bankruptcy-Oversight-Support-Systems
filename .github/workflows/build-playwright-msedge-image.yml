name: Build Playwright msedge Image

on:
  schedule:
    - cron: '0 5 * * 0'  # Every Sunday at 5:00 AM UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'test/e2e/Dockerfile.playwright-msedge'
      - '.github/workflows/build-playwright-msedge-image.yml'

env:
  REGISTRY: ghcr.io

permissions: read-all

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set lowercase repository name
        shell: bash
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          echo "REPO=$(echo "${GITHUB_REPOSITORY_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@ba754150c9dbbaa912ae0ac3cfba43f84195cef2 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/playwright-msedge
          tags: |
            type=raw,value=v1.62.1-noble
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba # v7.0.0
        with:
          context: test/e2e
          file: test/e2e/Dockerfile.playwright-msedge
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print pushed image digest
        run: |
          echo "Pushed ${{ env.REGISTRY }}/${{ env.REPO }}/playwright-msedge@${{ steps.build.outputs.digest }}"
          echo "Update the container image reference in reusable-accessibility.yml with this digest."
