name: Security

on:
  workflow_call:
    secrets:
      AZ_SECURITY_SCAN_CLIENT_ID:
        required: true
      AZ_TENANT_ID:
        required: true
      AZ_SUBSCRIPTION_ID:
        required: true
    inputs:
      skip:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  sca-scan:
    name: SCA Scan
    runs-on: ubuntu-latest
    environment: security-scan
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ ! inputs.skip }}

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        if: ${{ ! inputs.skip }}
        with:
          client-id: ${{ secrets.AZ_SECURITY_SCAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch secrets from Key Vault
        if: ${{ ! inputs.skip }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          kv_to_env AZ_SECURITY_SCAN_STORAGE_NAME kv-ustp-cams AZ-SECURITY-SCAN-STORAGE-NAME
          kv_to_env SNYK_OAUTH_CLIENT_ID kv-ustp-cams SNYK-OAUTH-CLIENT-ID
          kv_to_env SNYK_OAUTH_CLIENT_SECRET kv-ustp-cams SNYK-OAUTH-CLIENT-SECRET

      - name: Setup Snyk CLI
        if: ${{ ! inputs.skip }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: latest

      - name: Authenticate with Snyk
        if: ${{ ! inputs.skip }}
        run:
          snyk auth --auth-type=oauth --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
          --client-id="$SNYK_OAUTH_CLIENT_ID"
        env:
          SNYK_API: https://api.snykgov.io

      - name: Run Snyk SCA scan
        if: ${{ ! inputs.skip }}
        run:
          snyk test --all-projects --exclude=function-apps,integration --severity-threshold=medium
          --policy-path=. --sarif-file-output=snyk-sca.sarif
        env:
          SNYK_API: https://api.snykgov.io

      - name: Monitor project in Snyk
        if: ${{ ! inputs.skip && always() }}
        run: snyk monitor --all-projects --exclude=function-apps,integration
        env:
          SNYK_API: https://api.snykgov.io

      - name: Upload raw SARIF to Azure Storage
        if: ${{ ! inputs.skip && always() }}
        run: |
          if [ -f snyk-sca.sarif ]; then
            az storage blob upload \
              --account-name "$AZ_SECURITY_SCAN_STORAGE_NAME" \
              --auth-mode login \
              -f snyk-sca.sarif \
              -c security-scan-results \
              -n "snyk-sca-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.ref_name }}.sarif" \
              --overwrite
          fi

      - name: Sanitize SARIF for GitHub upload
        if: ${{ ! inputs.skip && always() }}
        run: |
          if [ -f snyk-sca.sarif ]; then
            jq 'walk(
              if type == "object" and has("security-severity") and
                (.["security-severity"] | type == "string") and
                (.["security-severity"] | test("^[0-9]+(\\.[0-9]+)?$") | not)
              then del(.["security-severity"])
              else . end
            )' snyk-sca.sarif > snyk-sca-sanitized.sarif && mv snyk-sca-sanitized.sarif snyk-sca.sarif
          fi

      - name: Upload SARIF to GitHub
        if: ${{ ! inputs.skip && always() }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: snyk-sca.sarif

  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    environment: security-scan
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ ! inputs.skip }}

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        if: ${{ ! inputs.skip }}
        with:
          client-id: ${{ secrets.AZ_SECURITY_SCAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch secrets from Key Vault
        if: ${{ ! inputs.skip }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          kv_to_env AZ_SECURITY_SCAN_STORAGE_NAME kv-ustp-cams AZ-SECURITY-SCAN-STORAGE-NAME
          kv_to_env SNYK_OAUTH_CLIENT_ID kv-ustp-cams SNYK-OAUTH-CLIENT-ID
          kv_to_env SNYK_OAUTH_CLIENT_SECRET kv-ustp-cams SNYK-OAUTH-CLIENT-SECRET

      - name: Setup Snyk CLI
        if: ${{ ! inputs.skip }}
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: latest

      - name: Authenticate with Snyk
        if: ${{ ! inputs.skip }}
        run:
          snyk auth --auth-type=oauth --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
          --client-id="$SNYK_OAUTH_CLIENT_ID"
        env:
          SNYK_API: https://api.snykgov.io

      - name: Run Snyk Code (SAST) scan
        if: ${{ ! inputs.skip }}
        id: snyk-scan
        continue-on-error: true
        run: snyk code test --severity-threshold=medium --sarif-file-output=snyk-code.sarif
        env:
          SNYK_API: https://api.snykgov.io

      - name: Upload raw SARIF to Azure Storage
        if: ${{ ! inputs.skip && always() }}
        run: |
          if [ -f snyk-code.sarif ]; then
            az storage blob upload \
              --account-name "$AZ_SECURITY_SCAN_STORAGE_NAME" \
              --auth-mode login \
              -f snyk-code.sarif \
              -c security-scan-results \
              -n "snyk-code-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.ref_name }}.sarif" \
              --overwrite
          fi

      - name: Download SAST baseline
        id: baseline
        if: ${{ ! inputs.skip && always() }}
        run: |
          if az storage blob download \
            --account-name "$AZ_SECURITY_SCAN_STORAGE_NAME" \
            --auth-mode login \
            -c snyk-baseline \
            -n snyk-code-baseline.txt \
            -f snyk-code-baseline.txt 2>/dev/null; then
            echo "baseline_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SAST baseline found. All findings will be treated as new."
            echo "baseline_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare against baseline
        id: baseline-compare
        if: ${{ ! inputs.skip && always() && steps.snyk-scan.outcome == 'failure' }}
        run: |
          if ops/scripts/pipeline/snyk-baseline-compare.sh snyk-code.sarif snyk-code-baseline.txt; then
            echo "has_new_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_findings=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanitize SARIF for GitHub upload
        if: ${{ ! inputs.skip && always() }}
        run: |
          if [ -f snyk-code.sarif ]; then
            jq 'walk(
              if type == "object" and has("security-severity") and
                (.["security-severity"] | type == "string") and
                (.["security-severity"] | test("^[0-9]+(\\.[0-9]+)?$") | not)
              then del(.["security-severity"])
              else . end
            )' snyk-code.sarif > snyk-code-sanitized.sarif && mv snyk-code-sanitized.sarif snyk-code.sarif
          fi

      - name: Upload SARIF to GitHub
        if: ${{ ! inputs.skip && always() }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: snyk-code.sarif

      - name: Fail on new findings
        if: ${{ ! inputs.skip && always() }}
        env:
          SCAN_OUTCOME: ${{ steps.snyk-scan.outcome }}
          HAS_NEW_FINDINGS: ${{ steps.baseline-compare.outputs.has_new_findings }}
        run: |
          if [[ "$SCAN_OUTCOME" == "success" ]]; then
            echo "Snyk Code scan passed — no findings."
            exit 0
          fi
          if [[ "$HAS_NEW_FINDINGS" == "true" ]]; then
            echo "New SAST findings detected that are not in the baseline."
            exit 1
          fi
          echo "Snyk Code scan found issues, but all match the accepted baseline."
          exit 0
