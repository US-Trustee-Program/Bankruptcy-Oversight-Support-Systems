name: DAST Scan

on:
  workflow_call:
    inputs:
      apiFunctionName:
        required: true
        type: string
      webappName:
        required: true
        type: string
      stackName:
        required: true
        type: string
      ghaEnvironment:
        required: true
        type: string
      branchHashId:
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap-dast-scan:
    environment: ${{ inputs.ghaEnvironment == 'Main-Gov' && 'dast-main' || 'dast-branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: write
    env:
      priority: 201
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch config from Key Vault
        env:
          GHA_ENVIRONMENT: ${{ inputs.ghaEnvironment }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          # CAMS-760, Option E / Slice 2: branches deploy into the SAME stable
          # app RG main uses, distinguished by per-branch-unique resource
          # names, rather than a per-branch hash-suffixed RG (matches
          # reusable-deploy.yml's derivation — keep both in lockstep).
          kv_to_env AZ_APP_RG "$KV" AZ-APP-RG
          if ! kv_to_env SLOT_NAME "$KV" SLOT-NAME; then
            echo "Cannot deploy to slot without SLOT-NAME." >&2
            exit 1
          fi
          kv_to_env AZURE_RG "$KV" AZURE-RG

      - name: Enable GHA runner access
        run: |
          ./ops/scripts/pipeline/dev-add-allowed-ip.sh \
          -g ${{ env.AZ_APP_RG }} \
          -s ${{ inputs.stackName }} \
          -p ${{ env.priority }} \
          --slot-name ${{ env.SLOT_NAME }} \
          --is-cicd

          ./ops/scripts/pipeline/dev-add-allowed-ip.sh \
          -g ${{ env.AZ_APP_RG }} \
          -s ${{ inputs.stackName }} \
          -p ${{ env.priority }} \
          --is-cicd

          ./ops/scripts/pipeline/add-sql-firewall-rule.sh \
          -g ${{ env.AZURE_RG }} \
          --stack-name ${{ inputs.stackName }} \
          --server-name ${{ secrets.AZ_SQL_SERVER_NAME }}

      - name: Prepare ZAP Context File
        env:
          BASE_URL: 'https://ustp-cams-webapp.azurewebsites.us/'
          OKTA_USERNAME: '${{ secrets.OKTA_USER_NAME }}'
          OKTA_PASSWORD: '${{ secrets.OKTA_PASSWORD }}'
        run: pushd test/dast && ./merge.sh && popd

      - name: Run ZAP DAST Full Scan
        id: zap_scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: https://${{ inputs.webappName }}-${{ env.SLOT_NAME }}.azurewebsites.us
          cmd_options: >-
            -a -j -c test/dast/config/cams-ui.context -z "-config
            script.scripts.okta-auth.enabled=true" -z "-config
            script.scripts.okta-auth.engine=Oracle Nashorn" -z "-config
            script.scripts.okta-auth.type=authentication" -z "-config
            script.scripts.okta-auth.file=/test/dast/config/okta-auth.zst" -z "-config
            ajaxSpider.browserId=chrome-headless" -z "-config ajaxSpider.clickDefaultElems=true" -z
            "-config ajaxSpider.clickElemsOnce=true" -z "-config ajaxSpider.eventWait=5000" -z
            "-config ajaxSpider.maxCrawlDepth=10" -z "-config ajaxSpider.maxDuration=60" -z "-config
            ajaxSpider.numberOfBrowsers=1" -z "-config ajaxSpider.randomInputs=true"
          rules_file_name: 'test/dast/config/dast-rules.tsv'
          fail_action: 'false'
          allow_issue_writing: 'false'
          artifact_name: 'zap-report'

      - name: Convert ZAP JSON to SARIF
        run: |
          python3 test/dast/zap_json_to_sarif.py ./report_json.json ./report.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ./report.sarif

      - name: Delete ZAP artifact
        if: always()
        run: |
          # Get the artifact ID for the zap-report artifact
          ARTIFACT_ID=$(curl -s -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" | \
            jq -r '.artifacts[] | select(.name == "zap-report") | .id')

          # Delete the artifact if it exists
          if [ ! -z "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            curl -s -X DELETE \
              -H "Authorization: token ${{ github.token }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID"
            echo "Deleted ZAP artifact with ID: $ARTIFACT_ID"
          else
            echo "No ZAP artifact found to delete"
          fi

      - name: Cleanup local ZAP files
        if: always()
        run: |
          rm -f ./report_json.json
          rm -f ./zap-report.zip

      - name: Disable GHA runner access
        if: always()
        run: |
          name="gha-${{ env.priority }}-${{ inputs.stackName }}"
          ./ops/scripts/pipeline/dev-rm-allowed-ip.sh \
          -g ${{ env.AZ_APP_RG }} \
          -s ${{ inputs.stackName }} \
          -r ${name:0:32} \
          --slot-name ${{ env.SLOT_NAME }}

          name="gha-${{ env.priority }}-${{ inputs.stackName }}"
          ./ops/scripts/pipeline/dev-rm-allowed-ip.sh \
          -g ${{ env.AZ_APP_RG }} \
          -s ${{ inputs.stackName }} \
          -r ${name:0:32}

          ./ops/scripts/pipeline/add-sql-firewall-rule.sh \
          -g ${{ env.AZURE_RG }} \
          --stack-name ${{ inputs.stackName }} \
          --server-name ${{ secrets.AZ_SQL_SERVER_NAME }} \
          --delete
