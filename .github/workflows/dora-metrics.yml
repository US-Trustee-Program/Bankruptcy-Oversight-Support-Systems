name: DORA Metrics

on:
  schedule:
    - cron: '0 12 * * 1' # Weekly on Monday at 12:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  deployment-frequency:
    name: Report deployment frequency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Get source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run deployment frequency report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run report:deployment-frequency --workspace=dora-metrics

      - name: Upload deployment frequency report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dora-metrics-deployment-frequency
          path: dora-metrics/data/deployment-frequency.csv
          if-no-files-found: error
