name: DORA Metrics

on:
  schedule:
    # Tuesday 01:00 UTC: the reports cover weeks ending Monday 00:00 UTC. The docs page shows the
    # week before last, so that week's changes have had over a week to deploy, its incidents to
    # close, and its deployments' 24-hour change-failure windows to end.
    - cron: '0 1 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  deployment-frequency:
    name: Report deployment frequency
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-dora-metrics-report.yml
    with:
      npm-script: report:deployment-frequency
      artifact-name: dora-metrics-deployment-frequency
      artifact-path: dora-metrics/data/deployment-frequency.csv
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  lead-time:
    name: Report lead time for changes
    permissions:
      contents: read
      actions: read
      issues: read
    uses: ./.github/workflows/reusable-dora-metrics-report.yml
    with:
      npm-script: report:lead-time
      artifact-name: dora-metrics-lead-time
      artifact-path: |
        dora-metrics/data/lead-time-detail.csv
        dora-metrics/data/lead-time-by-period.csv
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  change-failure-rate:
    name: Report change failure rate
    permissions:
      contents: read
      actions: read
      issues: read
    uses: ./.github/workflows/reusable-dora-metrics-report.yml
    with:
      npm-script: report:change-failure-rate
      artifact-name: dora-metrics-change-failure-rate
      artifact-path: |
        dora-metrics/data/change-failure-detail.csv
        dora-metrics/data/change-failure-rate-by-period.csv
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  mttr:
    name: Report mean time to restore
    permissions:
      contents: read
      actions: read
      issues: read
    uses: ./.github/workflows/reusable-dora-metrics-report.yml
    with:
      npm-script: report:mttr
      artifact-name: dora-metrics-mttr
      artifact-path: |
        dora-metrics/data/mttr-detail.csv
        dora-metrics/data/mttr-by-period.csv
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  docs-page:
    name: Render docs page
    # Independent of publish: either can fail without blocking the other.
    needs: [deployment-frequency, lead-time, change-failure-rate, mttr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      # The report artifacts hold bare CSV file names, so this restores them to where
      # the report scripts wrote them.
      - name: Download report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dora-metrics-*
          path: dora-metrics/data
          merge-multiple: true

      - name: Render page
        run: npm run report:docs-page --workspace=dora-metrics

      # Deploy GitHub Pages fetches this artifact by name. It must not match dora-metrics-*,
      # or the publish job would upload the page to storage with the CSVs.
      - name: Upload page artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dora-docs-page
          path: dora-metrics/data/dora-metrics.md
          if-no-files-found: error
          # Deploy GitHub Pages fails rather than serve the placeholder once no recent run has an
          # unexpired page, so a page must outlive any gap between successful weekly runs.
          retention-days: 90

      # Deploy GitHub Pages posts this to Slack after it publishes this run's page. Same naming
      # rule as dora-docs-page. Only the triggering run's headline is posted, so a short life is enough.
      - name: Upload Slack headline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dora-slack-headline
          path: dora-metrics/data/dora-slack-headline.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish reports to storage
    needs: [deployment-frequency, lead-time, change-failure-rate, mttr]
    runs-on: ubuntu-latest
    # The federated credential's subject names this workflow and environment;
    # renaming either breaks Azure login until
    # setup-dora-metrics-federated-credential.sh is re-run.
    environment: dora-metrics
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dora-metrics-*
          path: reports
          merge-multiple: true

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch storage account name from Key Vault
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          kv_to_env AZ_DORA_METRICS_STORAGE_NAME kv-ustp-cams AZ-DORA-METRICS-STORAGE-NAME

      - name: Upload reports
        run: |
          set -euo pipefail
          # Folder date is the run's creation date, so re-running a failed
          # publish on a later day writes to the same folder.
          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')
          destination="runs/${created:0:10}-${GITHUB_RUN_ID}"

          az storage blob upload-batch \
            --account-name "${AZ_DORA_METRICS_STORAGE_NAME}" \
            --auth-mode login \
            --destination dora-metrics \
            --destination-path "${destination}" \
            --source reports \
            --overwrite \
            --only-show-errors

          echo "Published to dora-metrics/${destination}/:" >> "${GITHUB_STEP_SUMMARY}"
          find reports -type f -printf '- %P\n' | sort >> "${GITHUB_STEP_SUMMARY}"
        env:
          GH_TOKEN: ${{ github.token }}
