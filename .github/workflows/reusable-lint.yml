name: ESLint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci --include=dev
      - name: Build Common
        run: npm run build:common
      - name: Validate ESLint config surfaces
        run: npm run lint:validate
      - name: Run ESLint
        run: npm run lint -- --quiet
      - name: Run ESLint (ops/ — not an npm workspace)
        run: npm run lint:ops -- --quiet
      - name: Guard against re-stacking the app deploy (GH #2749)
        # Runs the same check as the local pre-commit hook
        # (.pre-commit-hooks/guard-app-deploy-not-stacked.sh), directly rather
        # than via the pre-commit framework (no Python/pre-commit install
        # needed — the hook itself is a self-contained bash script). A local
        # hook alone is bypassable (`--no-verify`, a web-UI merge, editing the
        # file without a local commit) and nothing else in CI re-checks this,
        # so this makes the GH #2749 backstop actually enforced rather than
        # advisory-only.
        run: bash .pre-commit-hooks/guard-app-deploy-not-stacked.sh
