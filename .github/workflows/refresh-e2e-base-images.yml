name: Refresh E2E Base Image Cache

on:
  schedule:
    - cron: '0 5 * * 0'  # Weekly on Sunday at 05:00 UTC (before prune at 06:00)
  workflow_dispatch:       # Allow manual trigger

permissions: read-all

jobs:
  refresh:
    name: Re-cache upstream base images to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh base images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: test/e2e/scripts/cache-base-images.sh
