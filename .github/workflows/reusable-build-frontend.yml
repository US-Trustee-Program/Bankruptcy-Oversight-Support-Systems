name: Build Frontend

on:
  workflow_call:
    inputs:
      isDeployment:
        default: false
        type: boolean
      camsServerHostname:
        required: true
        type: string
      apiFunctionName:
        required: true
        type: string
      camsServerPort:
        required: true
        type: string
      camsServerProtocol:
        required: true
        type: string
      camsBasePath:
        required: true
        type: string
      webappName:
        required: true
        type: string
      environment:
        required: true
        type: string
      launchDarklyEnvironment:
        required: true
        type: string
    secrets:
      AZ_CLIENT_ID:
        required: true
      AZ_TENANT_ID:
        required: true
      AZ_SUBSCRIPTION_ID:
        required: true
      LD_DEVELOPMENT_CLIENT_ID:
        required: true

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    environment:
      ${{ inputs.environment == 'Main-Gov' && 'build-frontend-main' || 'build-frontend-branch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch config from Key Vault
        env:
          GHA_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          # CAMS-760, Option E / Slice 2: branches deploy into the SAME stable
          # app RG main uses, distinguished by per-branch-unique resource
          # names, rather than a per-branch hash-suffixed RG (matches
          # reusable-deploy.yml's derivation — keep both in lockstep).
          kv_to_env AZ_APP_RG "$KV" AZ-APP-RG
          # Optional: absent outside slot-deploying environments, and an empty
          # SLOT_NAME is a meaningful value downstream.
          kv_to_env SLOT_NAME "$KV" SLOT-NAME --optional
          kv_to_env CAMS_LOGIN_PROVIDER "$KV" CAMS-LOGIN-PROVIDER

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Execute Build
        env:
          WEBAPP_NAME: ${{ inputs.webappName }}
          CAMS_SERVER_HOSTNAME: ${{ inputs.camsServerHostname }}
          CAMS_SERVER_PORT: ${{ inputs.camsServerPort }}
          CAMS_SERVER_PROTOCOL: ${{ inputs.camsServerProtocol }}
          CAMS_BASE_PATH: ${{ inputs.camsBasePath }}
          CAMS_FEATURE_FLAG_CLIENT_ID: ${{ secrets.LD_DEVELOPMENT_CLIENT_ID }}
          CAMS_LAUNCH_DARKLY_ENV: ${{ inputs.launchDarklyEnvironment }}
          CAMS_INFO_SHA: ${{ github.sha }}
          CAMS_LOGIN_PROVIDER_CONFIG: ${{ vars.CAMS_LOGIN_PROVIDER_CONFIG }}
        run: |
          appiString=$(az monitor app-insights component show --app "appi-${WEBAPP_NAME}" -g  ${{ env.AZ_APP_RG }} --query "connectionString" -o tsv || true)

          export CAMS_SERVER_HOSTNAME="${CAMS_SERVER_HOSTNAME}"
          export CAMS_SERVER_PORT="${CAMS_SERVER_PORT}"
          export CAMS_SERVER_PROTOCOL="${CAMS_SERVER_PROTOCOL}"
          export CAMS_BASE_PATH="${CAMS_BASE_PATH}"
          export CAMS_APPLICATIONINSIGHTS_CONNECTION_STRING="${appiString}"
          export CAMS_FEATURE_FLAG_CLIENT_ID="${CAMS_FEATURE_FLAG_CLIENT_ID}"
          export CAMS_LAUNCH_DARKLY_ENV="${CAMS_LAUNCH_DARKLY_ENV}"
          export CAMS_LOGIN_PROVIDER=${{ env.CAMS_LOGIN_PROVIDER }}
          export CAMS_LOGIN_PROVIDER_CONFIG="${CAMS_LOGIN_PROVIDER_CONFIG}"
          export CAMS_INFO_SHA="${CAMS_INFO_SHA}"
          npm run build:user-interface

      - name: Generate Slot Configuration
        working-directory: user-interface
        env:
          WEBAPP_NAME: ${{ inputs.webappName }}
          API_FUNCTION_NAME: ${{ inputs.apiFunctionName }}
          CAMS_SERVER_PORT: ${{ inputs.camsServerPort }}
          CAMS_SERVER_PROTOCOL: ${{ inputs.camsServerProtocol }}
          CAMS_BASE_PATH: ${{ inputs.camsBasePath }}
          CAMS_FEATURE_FLAG_CLIENT_ID: ${{ secrets.LD_DEVELOPMENT_CLIENT_ID }}
          CAMS_LAUNCH_DARKLY_ENV: ${{ inputs.launchDarklyEnvironment }}
          CAMS_INFO_SHA: ${{ github.sha }}
          CAMS_LOGIN_PROVIDER_CONFIG: ${{ vars.CAMS_LOGIN_PROVIDER_CONFIG }}
        run: |
          SLOT_NAME="${{ env.SLOT_NAME || 'staging' }}"
          echo "Slot name: ${SLOT_NAME}"
          STAGING_HOSTNAME="${API_FUNCTION_NAME}-${SLOT_NAME}.azurewebsites.us"
          echo "Staging hostname: ${STAGING_HOSTNAME}"
          appiString=$(az monitor app-insights component show --app "appi-${WEBAPP_NAME}" -g  ${{ env.AZ_APP_RG }} --query "connectionString" -o tsv || true)
          export CAMS_SERVER_HOSTNAME="${STAGING_HOSTNAME}"
          export CAMS_SERVER_PORT="${CAMS_SERVER_PORT}"
          export CAMS_SERVER_PROTOCOL="${CAMS_SERVER_PROTOCOL}"
          export CAMS_BASE_PATH="${CAMS_BASE_PATH}"
          export CAMS_APPLICATIONINSIGHTS_CONNECTION_STRING="${appiString}"
          export CAMS_FEATURE_FLAG_CLIENT_ID="${CAMS_FEATURE_FLAG_CLIENT_ID}"
          export CAMS_LAUNCH_DARKLY_ENV="${CAMS_LAUNCH_DARKLY_ENV}"
          export CAMS_LOGIN_PROVIDER=${{ env.CAMS_LOGIN_PROVIDER }}
          export CAMS_LOGIN_PROVIDER_CONFIG="${CAMS_LOGIN_PROVIDER_CONFIG}"
          export CAMS_INFO_SHA="${CAMS_INFO_SHA}"
          export SLOT_NAME="${SLOT_NAME}"
          npm run slotConfig
          mv ./public/configuration-${SLOT_NAME}.json ./build/

      - name: Package
        if: inputs.isDeployment
        working-directory: user-interface
        env:
          WEBAPP_NAME: ${{ inputs.webappName }}
        run: |
          pushd ./build
          zip -r "./${WEBAPP_NAME}.zip" .
          popd
          mkdir ./artifacts
          mv "./build/${WEBAPP_NAME}.zip" ./artifacts/

      - name: Upload Frontend Artifact
        if: inputs.isDeployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.webappName }}-build
          path: user-interface/artifacts/
          if-no-files-found: error
