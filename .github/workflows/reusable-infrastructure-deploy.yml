name: Azure Deployment - Supporting Infrastructure

on:
  workflow_call:
    inputs:
      ghaEnvironment:
        required: true
        type: string
      apiFunctionName:
        required: true
        type: string
      dataflowsFunctionName:
        required: true
        type: string
      environmentHash:
        required: true
        type: string
      stackName:
        required: true
        type: string
    secrets:
      AZ_CLIENT_ID:
        required: true
      AZ_TENANT_ID:
        required: true
      AZ_SUBSCRIPTION_ID:
        required: true
      AZ_LOCATION:
        required: true
      AZ_SQL_SERVER_NAME:
        required: true
      AZ_ACTION_GROUP_NAME:
        required: true

permissions:
  contents: read

jobs:
  deploy-log-analytics-workspace:
    runs-on: ubuntu-latest
    environment:
      ${{ inputs.ghaEnvironment == 'Main-Gov' && 'infrastructure-deploy-main' ||
      'infrastructure-deploy-branch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch config from Key Vault
        env:
          GHA_ENVIRONMENT: ${{ inputs.ghaEnvironment }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          kv_to_env AZ_ANALYTICS_WORKSPACE_NAME "$KV" AZ-ANALYTICS-WORKSPACE-NAME
          kv_to_env AZ_ANALYTICS_RG "$KV" AZ-ANALYTICS-RG

      - name: Deploy Log Analytics Workspace
        id: azure-analytics-deploy
        env:
          AZ_LOCATION: ${{ secrets.AZ_LOCATION }} # pragma: allowlist secret
        run: |
          az deployment group create \
            -g "${AZ_ANALYTICS_RG}" \
            -f ./ops/cloud-deployment/lib/analytics/log-analytics-workspace.bicep \
            -p workspaceName=${{ env.AZ_ANALYTICS_WORKSPACE_NAME }} \
               location="${AZ_LOCATION}"

  deploy-db:
    runs-on: ubuntu-latest
    environment:
      ${{ inputs.ghaEnvironment == 'Main-Gov' && 'infrastructure-deploy-main' ||
      'infrastructure-deploy-branch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch config from Key Vault
        env:
          GHA_ENVIRONMENT: ${{ inputs.ghaEnvironment }}
          STACK_NAME: ${{ inputs.stackName }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          # CAMS-760, Option E / Slice 2: branches deploy into the SAME stable
          # network RG main uses, distinguished by per-branch-unique resource
          # names, rather than a per-branch hash-suffixed RG (matches
          # reusable-deploy.yml's derivation — keep both in lockstep).
          kv_to_env AZ_NETWORK_RG "$KV" AZ-NETWORK-RG
          kv_to_env AZURE_RG "$KV" AZURE-RG
          kv_to_env AZ_ANALYTICS_RG "$KV" AZ-ANALYTICS-RG
          kv_to_env AZ_COSMOS_DATABASE_NAME "$KV" AZ-COSMOS-DATABASE-NAME
          kv_to_env AZ_COSMOS_MONGO_ACCOUNT_NAME "$KV" AZ-COSMOS-MONGO-ACCOUNT-NAME
          kv_to_env AZ_ANALYTICS_WORKSPACE_ID "$KV" AZ-ANALYTICS-WORKSPACE-ID
          kv_to_env AZ_KV_APP_CONFIG_MANAGED_ID "$KV" AZ-KV-APP-CONFIG-MANAGED-ID
          kv_to_env AZ_KV_APP_CONFIG_NAME "$KV" AZ-KV-APP-CONFIG-NAME
          kv_to_env AZ_KV_APP_CONFIG_RG_NAME "$KV" AZ-KV-APP-CONFIG-RG-NAME
          kv_get AZ_NETWORK_VNET_NAME_KV "$KV" AZ-NETWORK-VNET-NAME
          # CAMS-760, Option E / Slice 2: each branch owns its own uniquely-named
          # VNet (vnet-<stackName>) in the now-shared network RG, not the fixed
          # KV-sourced name -- matches reusable-deploy.yml's identical
          # derivation (keep both in lockstep). Missing this made the vnet
          # subnet lookup below silently target main's vnet name for every
          # branch, which doesn't exist under that name, since main and
          # branches were never guaranteed to differ before Slice 2, and
          # differ unconditionally now.
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            AZ_NETWORK_VNET_NAME="${AZ_NETWORK_VNET_NAME_KV}"
          else
            AZ_NETWORK_VNET_NAME="vnet-${STACK_NAME}"
          fi
          kv_mask_and_write AZ_NETWORK_VNET_NAME "${AZ_NETWORK_VNET_NAME}"

      - name: Generate E2E name
        id: generateE2eName
        env:
          GHA_ENVIRONMENT: ${{ inputs.ghaEnvironment }}
          ENVIRONMENT_HASH: ${{ inputs.environmentHash }}
        run: |
          e2eDatabaseName="${{ env.AZ_COSMOS_DATABASE_NAME }}-e2e"
          if [[ "${GHA_ENVIRONMENT}" != "Main-Gov" ]]; then
            echo "Adding suffix to database name"
            e2eDatabaseName="${e2eDatabaseName}-${ENVIRONMENT_HASH}"
          fi
          echo "e2eDatabaseName=${e2eDatabaseName}" >> $GITHUB_OUTPUT

      - name: Deploy Cosmos MongoDB
        id: azure-mongodb-deploy
        env:
          API_FUNCTION_NAME: ${{ inputs.apiFunctionName }}
          DATAFLOWS_FUNCTION_NAME: ${{ inputs.dataflowsFunctionName }}
          GHA_ENVIRONMENT: ${{ inputs.ghaEnvironment }}
          ENVIRONMENT_HASH: ${{ inputs.environmentHash || 'DOES_NOT_EXIST' }}
          AZ_ACTION_GROUP_NAME: ${{ secrets.AZ_ACTION_GROUP_NAME }} # pragma: allowlist secret
        run: |
          allowedNetworks=$(az network vnet subnet list -g ${{ env.AZ_NETWORK_RG }} --vnet-name ${{ env.AZ_NETWORK_VNET_NAME }} --query "[?name=='snet-${API_FUNCTION_NAME}' || name=='snet-${DATAFLOWS_FUNCTION_NAME}'].id" -o json)

          ./ops/scripts/pipeline/az-cosmos-deploy.sh \
            -g "${AZURE_RG}" \
            --accountName ${{ env.AZ_COSMOS_MONGO_ACCOUNT_NAME }} \
            --databaseName ${{ env.AZ_COSMOS_DATABASE_NAME }} \
            --environmentName "${GHA_ENVIRONMENT}" \
            --allowedNetworks "${allowedNetworks}" \
            --analyticsWorkspaceId ${{ env.AZ_ANALYTICS_WORKSPACE_ID }} \
            --actionGroupResourceGroup "${AZ_ANALYTICS_RG}" \
            --actionGroupName "${AZ_ACTION_GROUP_NAME}" \
            --keyVaultName ${{ env.AZ_KV_APP_CONFIG_NAME }} \
            --kvResourceGroup ${{ env.AZ_KV_APP_CONFIG_RG_NAME }} \
            --branchHashId "${ENVIRONMENT_HASH}" \
            --actionGroupSubscriptionId "${{ secrets.AZ_SUBSCRIPTION_ID }}"

      - name: Deploy E2E SQL Database
        id: azure-e2e-sql-deploy
        if: ${{ inputs.environmentHash != '' && inputs.ghaEnvironment != 'Main-Gov' }}
        env:
          ENVIRONMENT_HASH: ${{ inputs.environmentHash }}
          AZ_SQL_SERVER_NAME: ${{ secrets.AZ_SQL_SERVER_NAME }} # pragma: allowlist secret
        run: |
          e2eSqlDatabaseName="CAMS_E2E-${ENVIRONMENT_HASH}"
          sqlDbExists=$(az sql db show \
            -g "${AZURE_RG}" \
            -s "${AZ_SQL_SERVER_NAME}" \
            -n "${e2eSqlDatabaseName}" \
            --query id -o tsv 2>/dev/null || echo "")
          if [[ -z "${sqlDbExists}" ]]; then
            echo "Creating E2E SQL database ${e2eSqlDatabaseName}"
            az sql db create \
              -g "${AZURE_RG}" \
              -s "${AZ_SQL_SERVER_NAME}" \
              -n "${e2eSqlDatabaseName}" \
              --elastic-pool CAMS-ELASTIC-POOL
          else
            echo "E2E SQL database ${e2eSqlDatabaseName} already exists, skipping"
          fi
          echo "e2eSqlDatabaseName=${e2eSqlDatabaseName}" >> $GITHUB_OUTPUT

      - name: Deploy Dev Users Database
        id: azure-dev-users-deploy
        run: |
          az deployment group create \
            -g "${AZURE_RG}" \
            -f ./ops/cloud-deployment/lib/cosmos/mongo/cosmos-dev-users-database.bicep \
            -p accountName=${{ env.AZ_COSMOS_MONGO_ACCOUNT_NAME }}
