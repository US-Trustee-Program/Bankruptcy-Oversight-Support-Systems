name: LaunchDarkly Code References

on:
  push:
    branches: [ main ]   # update if your default branch has a different name
  pull_request:

jobs:
  find-code-references:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required so the scanner can detect references properly

      - name: Run LaunchDarkly code references
        uses: launchdarkly/find-code-references@v3
        with:
          accessToken: ${{ secrets.LD_ACCESS_TOKEN }}
          projKey: "cams"        # confirm with Mike Waite
          envKey: ${{ vars.AZURE_ENVIRONMENT }}     # optional; remove if not needed
          baseUri: "https://app.launchdarkly.us"  # default; include only if self-hosted 
