name: Clean up Flexion Azure Resources

on:
  delete:
  schedule:
    # Target 9-10 PM Pacific (05:00 UTC lands at 9pm during PST, 10pm during
    # PDT — both fine, see the check job's window below). A single cron
    # entry avoids double-firing across the DST boundary; GitHub's own
    # scheduler can also delay a cron trigger by hours (worse at :00, the
    # most contended minute platform-wide), so the check job accepts any
    # run landing in a 9pm-6am Pacific window rather than requiring the
    # exact hour — late is fine, but it must never fire during business
    # hours and tear down an env someone's actively using.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      hashId:
        description: 'Hash id of target branch deployment'
        default: ''
        type: string

permissions: read-all

jobs:
  list:
    runs-on: ubuntu-latest
    environment: 'remove-branch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List existing tagged Azure branch resources
        env:
          # This workflow only ever tears down branch/dev deployments (never
          # main), so this is always "Develop" — kept as a variable rather
          # than an inline literal for consistency with the KV-selection
          # pattern used elsewhere in this file and repo (Sourcery review,
          # PR #2773).
          GHA_ENVIRONMENT: 'Develop'
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          # CAMS-760, Option E / Slice 2: branches no longer create their own
          # tagged resource group — discover them via their app AND network
          # Deployment Stacks in the shared app/network RGs instead (both still
          # carry the same isBranchDeployment/branchName/branchHashId tags from
          # Slice 1).
          kv_get networkRgBase "$KV" AZ-NETWORK-RG
          kv_get appRgBase "$KV" AZ-APP-RG
          echo "List Azure network deployment stacks tagged as branch deployment resources"
          az stack group list -g "${networkRgBase}" --query "[?tags.isBranchDeployment == 'true'].{ Name:name Branch:tags.branchName HashId:tags.branchHashId }" -o table
          echo "List Azure app deployment stacks tagged as branch deployment resources"
          az stack group list -g "${appRgBase}" --query "[?tags.isBranchDeployment == 'true'].{ Name:name Branch:tags.branchName HashId:tags.branchHashId }" -o table

  check:
    runs-on: ubuntu-latest
    if:
      ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' &&
      inputs.hashId != '') || github.event.ref_type == 'branch' }}
    environment: 'remove-branch'
    permissions:
      contents: read
      id-token: write
    outputs:
      executeCleanup: ${{ steps.check.outputs.executeCleanup }}
      stackName: ${{ steps.check.outputs.stackName }}
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate Target Branch Hash
        id: hash
        if: ${{ github.event_name == 'delete' && github.event.ref_type == 'branch' }}
        env:
          GITHUB_EVENT_REF: ${{ github.event.ref }}
        run: |

          branchRef="${GITHUB_EVENT_REF}"
          hash=$(echo -n "${branchRef}" | openssl sha256 | awk '{print $2}')
          shortHash="${hash:0:6}"
          echo "hashId=$shortHash" >> $GITHUB_OUTPUT

      - name: Validate resources
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          HASH_ID_OVERRIDE: ${{ inputs.hashId }}
          STEP_HASH_ID: ${{ steps.hash.outputs.hashId }}
          APP_NAME: ${{ vars.APP_NAME }}
          DEV_SUFFIX: ${{ vars.DEV_SUFFIX }}
          # This workflow only ever tears down branch/dev deployments (never
          # main), so this is always "Develop" — kept as a variable rather
          # than an inline literal for consistency with the KV-selection
          # pattern used elsewhere in this file and repo (Sourcery review,
          # PR #2773).
          GHA_ENVIRONMENT: 'Develop'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_BRANCH_DAYS: ${{ vars.STALE_BRANCH_DAYS }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          # shellcheck source=ops/scripts/pipeline/_find-branch-stacks.sh
          source ops/scripts/pipeline/_find-branch-stacks.sh

          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          # CAMS-760, Option E / Slice 2: branches no longer create their own
          # tagged resource group — discover them via their app AND network
          # Deployment Stacks in the shared app/network RGs instead (both still
          # carry the same isBranchDeployment/branchName/branchHashId tags from
          # Slice 1). Discovering via the UNION of both tiers' tags (not just
          # network) means a branch whose network stack is somehow gone while
          # its app stack still exists (or vice versa) still gets swept, rather
          # than leaking silently forever. Stack names are "<stackName>-network"
          # / "<stackName>-app" where stackName already carries the hash (e.g.
          # "ustp-cams-dev-<hash>-network"), so the defensive name/tag
          # consistency check matches on that suffix instead of the old
          # "<rg-base>-<hash>" resource-group-name suffix.
          kv_get networkRgBase "$KV" AZ-NETWORK-RG
          kv_get appRgBase "$KV" AZ-APP-RG

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            localHour=$(TZ=America/Los_Angeles date +%H)
            # Accept any run landing between 9pm and 6am Pacific (not just
            # the exact top-of-hour target) so a scheduler delay still lets
            # cleanup run overnight, while still refusing to run during
            # business hours when a branch env could be in active use.
            if (( 10#${localHour} >= 6 && 10#${localHour} < 21 )); then
              echo "Skipping scheduled cleanup because Pacific local hour is ${localHour}, outside the 9pm-6am cleanup window."
              echo "executeCleanup=false" >> "$GITHUB_OUTPUT"
              jq -n '{targetBranchHashIds: [], staleBranchNotices: []}' > relay-payload.json
              exit 0
            fi

            find_branch_stacks taggedStacks "${networkRgBase}" "${appRgBase}"
            candidates=$(jq -c -n --argjson stacks "${taggedStacks}" '
              $stacks
              | [
                  .[]
                  | select(.branchHashId | test("^[0-9a-f]{6}$"))
                  | select((.branchName // "") as $branch | $branch != "main" and $branch != "refs/heads/main")
                  | .branchHashId as $branchHashId
                  | select(.name | test("-" + $branchHashId + "-(network|app)$"))
                  | {branchName, branchHashId}
                ]
              | unique_by(.branchHashId)
            ')

            # Only tear down envs whose branch is gone (orphaned, no staleness
            # check needed) or whose branch has had no commits for
            # STALE_BRANCH_DAYS — everything else is left running even though
            # this is a nightly sweep. A branch that still exists is never
            # deleted, only its Azure env is; owners are asked via Slack to
            # remove the branch themselves once it's flagged stale.
            staleDaysThreshold="${STALE_BRANCH_DAYS:-5}"
            if [[ ! "${staleDaysThreshold}" =~ ^[0-9]+$ ]]; then
              echo "::warning::STALE_BRANCH_DAYS ('${staleDaysThreshold}') is not a valid non-negative integer; falling back to the default of 5."
              staleDaysThreshold=5
            fi
            nowEpoch=$(date -u +%s)
            targets='[]'
            notices='[]'

            while IFS= read -r candidate; do
              branchName=$(jq -r '.branchName' <<<"${candidate}")
              branchHashId=$(jq -r '.branchHashId' <<<"${candidate}")

              # Branch names can contain slashes (e.g. "codex/foo"), which the
              # GitHub API requires percent-encoded in this path segment or
              # it 404s on an otherwise-existing branch.
              encodedBranchName=$(jq -rn --arg b "${branchName}" '$b | @uri')

              # A confirmed 404 here means the branch was deleted without the
              # `delete` event trigger catching it, e.g. this workflow was
              # disabled at the time — orphaned, safe to clean up. Any other
              # failure (rate limit, 5xx, transient network error) is
              # inconclusive, so it's treated as "leave it running" rather
              # than "assume gone" — deleting an active branch's env on a
              # flaky API call would be worse than skipping it for a night.
              # Disable errexit only around the call so failures don't abort
              # the script before they can be inspected.
              set +e
              branchApiOutput=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encodedBranchName}" 2>&1)
              branchLookupExitCode=$?
              set -e

              if [[ "${branchLookupExitCode}" -ne 0 ]]; then
                if grep -q "HTTP 404" <<<"${branchApiOutput}"; then
                  echo "Branch '${branchName}' no longer exists; env ${branchHashId} is orphaned and will be cleaned up."
                  targets=$(jq -c --arg h "${branchHashId}" '. + [$h]' <<<"${targets}")
                else
                  echo "::warning::Could not verify branch '${branchName}' ($(head -c 200 <<<"${branchApiOutput}")); leaving env ${branchHashId} in place rather than risk deleting it in error."
                fi
                continue
              fi

              branchInfo="${branchApiOutput}"

              # A single candidate with an unparseable commit date shouldn't
              # abort the whole sweep and leave every other candidate
              # unprocessed for the night — skip just this one instead.
              commitDate=$(jq -r '.commit.commit.committer.date' <<<"${branchInfo}")
              set +e
              commitEpoch=$(date -u -d "${commitDate}" +%s 2>/dev/null)
              dateParseExitCode=$?
              set -e

              if [[ "${dateParseExitCode}" -ne 0 || -z "${commitEpoch}" ]]; then
                echo "::warning::Could not parse last-commit date '${commitDate}' for branch '${branchName}'; leaving env ${branchHashId} in place rather than risk deleting it in error."
                continue
              fi

              idleDays=$(( (nowEpoch - commitEpoch) / 86400 ))

              if [[ "${idleDays}" -lt "${staleDaysThreshold}" ]]; then
                echo "Branch '${branchName}' last active ${idleDays}d ago (< ${staleDaysThreshold}d threshold); leaving env ${branchHashId} in place."
                continue
              fi

              echo "Branch '${branchName}' idle for ${idleDays}d (>= ${staleDaysThreshold}d threshold); tearing down env ${branchHashId} and notifying the branch owner."
              targets=$(jq -c --arg h "${branchHashId}" '. + [$h]' <<<"${targets}")
              # Prefer the commit AUTHOR's GitHub login over the committer's:
              # a merge/update commit created via GitHub's web UI (e.g. the
              # PR "Update branch" button) is attributed to GitHub's own
              # web-flow bot as committer, even though the author metadata
              # still correctly identifies the real developer. Falling back
              # to committer only when author is unset covers the rare case
              # of a commit with no linked GitHub account for its author.
              notice=$(jq -c -n \
                --arg branchName "${branchName}" \
                --argjson idleDays "${idleDays}" \
                --arg authorLogin "$(jq -r '.commit.author.login // .commit.committer.login // ""' <<<"${branchInfo}")" \
                --arg authorEmail "$(jq -r '.commit.commit.author.email // .commit.commit.committer.email // ""' <<<"${branchInfo}")" \
                '{branchName: $branchName, idleDays: $idleDays, authorLogin: $authorLogin, authorEmail: $authorEmail}')
              notices=$(jq -c --argjson n "${notice}" '. + [$n]' <<<"${notices}")
            done < <(jq -c '.[]' <<<"${candidates}")

            jq -n --argjson hashes "${targets}" --argjson notices "${notices}" --arg staleDaysThreshold "${staleDaysThreshold}" \
              '{targetBranchHashIds: $hashes, staleBranchNotices: $notices, staleDaysThreshold: $staleDaysThreshold}' > relay-payload.json

            targetCount=$(echo "${targets}" | jq length)
            if [[ "${targetCount}" -gt 0 ]]; then
              echo "Found ${targetCount} stale or orphaned Azure branch resource set(s) to clean up."
              echo "executeCleanup=true" >> "$GITHUB_OUTPUT"
            else
              echo "No stale or orphaned Azure branch resources found to clean up."
              echo "executeCleanup=false" >> "$GITHUB_OUTPUT"
            fi
          else
            target="${HASH_ID_OVERRIDE:-${STEP_HASH_ID}}"
            if [[ ! "${target}" =~ ^[0-9a-f]{6}$ ]]; then
              echo "Target branch hash '${target}' is not a valid six-character hex hash."
              echo "executeCleanup=false" >> "$GITHUB_OUTPUT"
              jq -n '{targetBranchHashIds: [], staleBranchNotices: []}' > relay-payload.json
              exit 0
            fi

            echo "Do existing Azure branch resources with hash $target exist?"
            find_branch_stacks taggedStacks "${networkRgBase}" "${appRgBase}" "${target}"
            count=$(jq -n --argjson stacks "${taggedStacks}" '
              $stacks
              | [
                  .[]
                  | select(.branchHashId | test("^[0-9a-f]{6}$"))
                  | select((.branchName // "") as $branch | $branch != "main" and $branch != "refs/heads/main")
                  | .branchHashId as $branchHashId
                  | select(.name | test("-" + $branchHashId + "-(network|app)$"))
                ]
              | length
            ')
            if [[ $count -gt 0 ]]; then
              echo 'Expected Azure branch resources found.'
              jq -n --arg h "${target}" '{targetBranchHashIds: [$h], staleBranchNotices: []}' > relay-payload.json
              echo "executeCleanup=true" >> "$GITHUB_OUTPUT"
            else
              echo 'Did not find existing Azure branch resources with matching hash id.'
              jq -n '{targetBranchHashIds: [], staleBranchNotices: []}' > relay-payload.json
              echo "executeCleanup=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Generate base stack name (without hash) for resource naming
          stackName=$(ops/scripts/pipeline/generate-stackname.sh Develop "${APP_NAME}" "${DEV_SUFFIX}" "")
          echo "Stack Name (base): $stackName"
          echo "stackName=$stackName" >> $GITHUB_OUTPUT
      - name: Upload target hash list for secret-free relay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-payload
          path: relay-payload.json
          retention-days: 1

  # This job's only purpose is to carry `targetBranchHashIds`,
  # `staleBranchNotices`, and `staleDaysThreshold` across the job boundary
  # without exposing them to GitHub's "may contain secret" output-masking
  # guard. `check` needs Azure
  # credentials (via azure/login) and GITHUB_TOKEN to do its discovery work,
  # so its own job-level output for these two arrays is permanently exposed
  # to that guard — and it has been silently dropping `targetBranchHashIds`
  # for any branch whose hash happens to collide with a masked value (e.g.
  # branch hash ff3151), which crashes `clean-up`'s
  # `fromJSON(needs.check.outputs.targetBranchHashIds)` matrix with "empty
  # input" and leaves the Azure environment leaked with no teardown and no
  # clear error. Moving the Slack secrets out of `check` (see `notify`'s
  # comment below) fixed an earlier, narrower instance of this same
  # collision, but did not fix this one, because `check` still has
  # Azure/GitHub credentials regardless of where the Slack secrets live.
  #
  # This job MUST reference zero secrets, zero tokens (not even
  # GITHUB_TOKEN), and nothing Key-Vault-derived — that is the entire reason
  # its outputs are safe from the masking guard. See
  # .pre-commit-hooks/guard-relay-job-secret-free.sh for the mechanical
  # check that enforces this stays true.
  relay:
    runs-on: ubuntu-latest
    needs: [check]
    # download-artifact/upload-artifact authenticate via the runner's internal
    # artifact-service token, not any `permissions:` scope -- `contents: read`
    # here was an unused grant in a job whose whole point is minimal surface
    # area.
    permissions: {}
    outputs:
      targetBranchHashIds: ${{ steps.relay.outputs.targetBranchHashIds }}
      staleBranchNotices: ${{ steps.relay.outputs.staleBranchNotices }}
      staleDaysThreshold: ${{ steps.relay.outputs.staleDaysThreshold }}
    steps:
      - name: Download target hash list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: relay-payload
      - name: Re-emit as job outputs
        id: relay
        run: |
          set -euo pipefail
          targetBranchHashIds=$(jq -c '.targetBranchHashIds // error("missing targetBranchHashIds")' relay-payload.json)
          staleBranchNotices=$(jq -c '.staleBranchNotices // error("missing staleBranchNotices")' relay-payload.json)
          # Unlike the two fields above, staleDaysThreshold is only ever
          # written on the nightly-sweep path (it's meaningless on the
          # single-target workflow_dispatch/delete path, which always emits
          # staleBranchNotices: [] and so never reaches `notify`, the only
          # consumer) -- absence here is expected, not a sign of a dropped
          # field, so this defaults rather than erroring.
          staleDaysThreshold=$(jq -r '.staleDaysThreshold // ""' relay-payload.json)
          echo "targetBranchHashIds=${targetBranchHashIds}" >> "$GITHUB_OUTPUT"
          echo "staleBranchNotices=${staleBranchNotices}" >> "$GITHUB_OUTPUT"
          echo "staleDaysThreshold=${staleDaysThreshold}" >> "$GITHUB_OUTPUT"
          echo "Relayed $(jq 'length' <<<"${targetBranchHashIds}") target hash(es) and $(jq 'length' <<<"${staleBranchNotices}") stale notice(s) to downstream jobs."

  # Separate from `check`: GitHub Actions registers every secret referenced
  # anywhere in a job as a masked value for the WHOLE job as soon as it
  # starts, not just the step that reads it. Keeping SLACK_WEBHOOK_URL/
  # SLACK_USER_MAPPING out of `check` avoids adding a second source of
  # output-masking collisions on top of the Azure/GitHub credentials `check`
  # already needs for its own discovery work (see `relay`'s comment above
  # for the full picture and why `staleBranchNotices` is read from `relay`,
  # not `check`, below).
  notify:
    runs-on: ubuntu-latest
    needs: [check, relay]
    if:
      needs.check.result == 'success' && needs.relay.result == 'success' &&
      needs.relay.outputs.staleBranchNotices != '[]'
    environment: 'remove-branch'
    permissions:
      contents: read
    steps:
      - name: Notify stale branch owners
        # Best-effort: a Slack outage shouldn't block the actual teardown
        # in `clean-up`, so this step's failure doesn't fail the job.
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MAPPING: ${{ secrets.SLACK_USER_MAPPING }}
          STALE_BRANCH_NOTICES: ${{ needs.relay.outputs.staleBranchNotices }}
          STALE_DAYS_THRESHOLD: ${{ needs.relay.outputs.staleDaysThreshold }}
        run: |
          set -euo pipefail
          staleDaysThreshold="${STALE_DAYS_THRESHOLD}"

          while IFS= read -r notice; do
            branchName=$(jq -r '.branchName' <<<"${notice}")
            idleDays=$(jq -r '.idleDays' <<<"${notice}")
            authorLogin=$(jq -r '.authorLogin' <<<"${notice}")
            authorEmail=$(jq -r '.authorEmail' <<<"${notice}")

            # Match on authorLogin only: it's GitHub's verified linked-account
            # identity, whereas authorEmail comes from raw git commit metadata
            # that anyone with push access can set to an arbitrary string
            # (git config user.email). authorEmail is still used below as a
            # display fallback, just not as a lookup key.
            slackId=$(echo "${SLACK_USER_MAPPING}" | jq -r --arg username "${authorLogin}" \
              '.[] | select(.github == $username) | .slack // empty' | head -1)

            if [[ -n "${slackId}" ]]; then
              who=" <@${slackId}>"
            else
              who=" (${authorLogin:-${authorEmail:-unknown author}})"
            fi

            message=$(printf '🧹 Branch `%s` has had no commits for %sd (stale threshold: %sd) — its Azure branch environment is being torn down tonight.%s If you'"'"'re still using this branch, push a commit to redeploy it; otherwise please delete the branch.' \
              "${branchName}" "${idleDays}" "${staleDaysThreshold}" "${who}")

            # A transient failure notifying one branch owner shouldn't abort
            # the loop and silently skip every remaining owner in the batch.
            curl -X POST -H 'Content-type: application/json' \
              --data "$(jq -n --arg text "${message}" '{text: $text}')" \
              "${SLACK_WEBHOOK_URL}" \
              || echo "::warning::Failed to send Slack notification for branch '${branchName}'."
          done < <(jq -c '.[]' <<<"${STALE_BRANCH_NOTICES}")

  clean-up:
    runs-on: ubuntu-latest
    needs: [check, relay]
    if:
      needs.check.result == 'success' && needs.relay.result == 'success' &&
      needs.check.outputs.executeCleanup == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        hashId: ${{ fromJSON(needs.relay.outputs.targetBranchHashIds) }}
    # Shares a concurrency group with continuous-deployment.yml's `deploy`
    # job, keyed on the same branch hash, so a nightly teardown can't run
    # against a branch while ANY part of its deploy chain (infra, supporting
    # infrastructure, or code-slot deploy — all nested inside sub-deploy.yml,
    # which `deploy` calls) is still in flight, not just the infrastructure
    # step.
    concurrency:
      group: cams-branch-${{ matrix.hashId }}
    environment: 'remove-branch'
    permissions:
      contents: read
      id-token: write
    env:
      environment: 'Develop'

    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch config from Key Vault
        env:
          GHA_ENVIRONMENT: 'Develop'
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          kv_to_env AZ_COSMOS_MONGO_ACCOUNT_NAME "$KV" AZ-COSMOS-MONGO-ACCOUNT-NAME

          kv_to_env AZ_APP_RG_BASE "$KV" AZ-APP-RG

          kv_to_env AZ_NETWORK_RG_BASE "$KV" AZ-NETWORK-RG

          kv_to_env AZ_KV_APP_CONFIG_RG_NAME "$KV" AZ-KV-APP-CONFIG-RG-NAME

          kv_to_env AZ_ANALYTICS_RG "$KV" AZ-ANALYTICS-RG

          kv_to_env AZURE_RG "$KV" AZURE-RG
      - name: Delete Branch Resources
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        id: deleteBranchResources
        env:
          AZ_SQL_SERVER_NAME: ${{ secrets.AZ_SQL_SERVER_NAME }}
          STACK_NAME: ${{ needs.check.outputs.stackName }}
          SHORT_HASH: ${{ matrix.hashId }}
        with:
          azcliversion: 2.62.0
          inlineScript: |
            export AZURE_CORE_USE_MSAL_HTTP_CACHE="${{ vars.AZURE_CORE_USE_MSAL_HTTP_CACHE || 'false' }}"
            ./ops/scripts/utility/az-delete-branch-resources.sh \
            --app-resource-group="${AZ_APP_RG_BASE}" \
            --db-account="${AZ_COSMOS_MONGO_ACCOUNT_NAME}" \
            --db-resource-group="${AZURE_RG}" \
            --kv-resource-group="${AZ_KV_APP_CONFIG_RG_NAME}" \
            --sql-server-name="${AZ_SQL_SERVER_NAME}" \
            --sql-resource-group="${AZURE_RG}" \
            --network-resource-group="${AZ_NETWORK_RG_BASE}" \
            --analytics-resource-group="${AZ_ANALYTICS_RG}" \
            --stack-name="${STACK_NAME}" \
            --short-hash="${SHORT_HASH}" \
            --unmanage-action=deleteResources

  # Checks the OUTCOME, not the mechanism: re-verifies that every hash this
  # run asked `clean-up` to delete is actually gone from Azure, rather than
  # trusting `clean-up`'s reported success as a proxy for that. Scoped to
  # this run's own target list (from `relay`, not an independent full
  # re-scan of every branch resource against every live branch) -- this
  # catches a `clean-up` actuation failure (the CAMS-884 bug shape) but not
  # a bug in `check`'s own discovery query, which is a separate concern.
  #
  # Uses azure/login like `check`/`clean-up` -- unlike `relay`, this job
  # does NOT need to be secret-free, because nothing downstream reads its
  # outputs via a fromJSON matrix.
  #
  # Two layers catch Azure's eventual-consistency window (a delete call can
  # report success before the resources are fully gone):
  #   1. An in-run retry below re-checks a hash once after a short sleep,
  #      catching the common seconds/minutes-scale lag within this same run.
  #   2. A 2-consecutive-run debounce (via actions/cache) still backstops
  #      slower cases: a hash is only a confirmed leak if it's present on
  #      two runs that included it in their target list, not on its first
  #      sighting. The cache is merged per-hash rather than overwritten
  #      wholesale, so a run with a different target-hash set than the
  #      previous one (e.g. a one-off branch-delete run vs. the nightly
  #      sweep) can't clobber another run's in-progress debounce for hashes
  #      it didn't check.
  assert-clean-state:
    runs-on: ubuntu-latest
    needs: [check, relay, clean-up]
    if: always() && needs.check.outputs.executeCleanup == 'true'
    environment: 'remove-branch'
    permissions:
      contents: read
      id-token: write
    env:
      ORPHAN_CACHE_PREFIX: cams-branch-cleanup-unresolved-orphans-
    steps:
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch RG config from Key Vault
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          KV="kv-ustp-cams-dev"
          kv_get networkRgBase "$KV" AZ-NETWORK-RG
          kv_get appRgBase "$KV" AZ-APP-RG
          echo "AZ_NETWORK_RG_BASE=${networkRgBase}" >> "$GITHUB_ENV"
          echo "AZ_APP_RG_BASE=${appRgBase}" >> "$GITHUB_ENV"
      - name: Restore previous unresolved-orphan state
        id: restore-cache
        # actions/cache keys are immutable once written, so `save` below
        # uses a unique key per run (github.run_id) -- it would otherwise
        # silently no-op on every run after the first, since the cache
        # service refuses to overwrite an existing key. `restore-keys` is a
        # prefix match that falls through to the most recently-created
        # cache matching it, i.e. whatever the previous run saved -- the
        # debounce step below merges that state per-hash rather than
        # trusting it wholesale, since "most recently saved" isn't
        # necessarily "most recent run that checked this particular hash".
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unresolved-orphans.json
          key: ${{ env.ORPHAN_CACHE_PREFIX }}${{ github.run_id }}
          restore-keys: |
            ${{ env.ORPHAN_CACHE_PREFIX }}
      - name: Warn on missing debounce state
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          echo "::warning::No prior unresolved-orphan cache found (eviction, quota, or first run) -- this run's debounce state starts empty, so any genuinely leaked hash checked this run will need one additional confirming run before it's reported."
      - name: Re-check each target hash and apply debounce
        id: check-state
        env:
          TARGET_HASH_IDS: ${{ needs.relay.outputs.targetBranchHashIds }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_find-branch-stacks.sh
          source ops/scripts/pipeline/_find-branch-stacks.sh
          [[ -f unresolved-orphans.json ]] || echo '[]' > unresolved-orphans.json

          check_hash() {
            local hash="$1" matches
            find_branch_stacks matches "${AZ_NETWORK_RG_BASE}" "${AZ_APP_RG_BASE}" "${hash}"
            jq 'length' <<<"${matches}"
          }

          stillPresent='[]'
          while IFS= read -r hash; do
            count=$(check_hash "${hash}")
            if [[ "${count}" -gt 0 ]]; then
              # Azure stack deletion is eventually consistent on a
              # seconds/minutes timescale -- one short retry here catches
              # the common case in-run, instead of costing it a full extra
              # run on the cross-run debounce below.
              echo "Hash ${hash}: resources present on first check; retrying in 60s before recording."
              sleep 60
              count=$(check_hash "${hash}")
            fi
            if [[ "${count}" -gt 0 ]]; then
              echo "Hash ${hash}: resources still present after clean-up and retry."
              stillPresent=$(jq -c --arg h "${hash}" '. + [$h]' <<<"${stillPresent}")
            fi
          done < <(jq -r '.[]' <<<"${TARGET_HASH_IDS}")

          # A hash is a confirmed leak only if it was present on the last
          # run that tracked it AND present again this run.
          confirmed=$(jq -n --argjson today "${stillPresent}" --slurpfile cached unresolved-orphans.json \
            '$today - ($today - ($cached[0] // []))')

          # Carry forward cached entries for hashes this run didn't check
          # at all, so a run with a different target-hash set can't erase
          # another run's in-progress debounce; only overwrite entries for
          # hashes this run actually re-checked.
          carriedForward=$(jq -c --argjson target "${TARGET_HASH_IDS}" --slurpfile cached unresolved-orphans.json \
            '($cached[0] // []) - $target')
          newState=$(jq -cn --argjson carried "${carriedForward}" --argjson today "${stillPresent}" \
            '($carried + $today) | unique')
          echo "${newState}" > unresolved-orphans.json
          echo "confirmedLeaks=${confirmed}" >> "$GITHUB_OUTPUT"
      - name: Save unresolved-orphan state for next run
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: unresolved-orphans.json
          key: ${{ env.ORPHAN_CACHE_PREFIX }}${{ github.run_id }}
      - name: Alert on confirmed leaks
        # A confirmed leak's remediation can't just be a normal red CI run --
        # the incident this workflow exists to prevent was exactly that
        # (a red teardown run going unactioned), so this reuses `notify`'s
        # Slack-webhook pattern for a higher-urgency, ops-facing message
        # rather than leaving detection as the only signal.
        if: steps.check-state.outputs.confirmedLeaks != '[]'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          curl -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "🚨 Azure branch-cleanup leak confirmed for 2 consecutive runs: ${{ steps.check-state.outputs.confirmedLeaks }}. Manual teardown required." '{text: $text}')" \
            "${SLACK_WEBHOOK_URL}" \
            || echo "::warning::Failed to send Slack alert for confirmed leak(s); falling through to the error annotation below regardless."
          echo "::error::Branch cleanup left resources behind for 2 consecutive runs: ${{ steps.check-state.outputs.confirmedLeaks }}"
          exit 1
