name: Endpoint Tests

on:
  workflow_call:
    inputs:
      apiFunctionName:
        required: true
        type: string
      webappName:
        required: true
        type: string
      stackName:
        required: true
        type: string
      ghaEnvironment:
        required: true
        type: string
      branchHashId:
        required: true
        type: string
      slotNameOverride:
        required: false
        type: string
        default: ''
        description:
          'Override slot name (e.g. "initial" or "self"). When empty, fetched from Key Vault.'
    secrets:
      AZ_CLIENT_ID:
        required: true
      AZ_TENANT_ID:
        required: true
      AZ_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read

jobs:
  endpoint-test-application:
    runs-on: ubuntu-latest
    environment:
      ${{ inputs.ghaEnvironment == 'Main-Gov' && 'endpoint-test-main' || 'endpoint-test-branch' }}
    permissions:
      contents: read
      id-token: write
    env:
      stackName: ${{ inputs.stackName }}
      webappName: ${{ inputs.webappName }}
      apiFunctionName: ${{ inputs.apiFunctionName }}
      branchHashId: ${{ inputs.branchHashId }}
      priority: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          environment: ${{ vars.AZURE_ENVIRONMENT }}

      - name: Fetch config from Key Vault
        env:
          GHA_ENVIRONMENT: ${{ inputs.ghaEnvironment }}
          SLOT_NAME_OVERRIDE: ${{ inputs.slotNameOverride }}
        run: |
          set -euo pipefail
          # shellcheck source=ops/scripts/pipeline/_kv-to-env.sh
          source ops/scripts/pipeline/_kv-to-env.sh
          if [[ "${GHA_ENVIRONMENT}" == "Main-Gov" ]]; then
            KV="kv-ustp-cams"
          else
            KV="kv-ustp-cams-dev"
          fi
          # CAMS-760, Option E / Slice 2: branches deploy into the SAME stable
          # app RG main uses, distinguished by per-branch-unique resource
          # names, rather than a per-branch hash-suffixed RG (matches
          # reusable-deploy.yml's derivation — keep both in lockstep).
          kv_to_env AZ_APP_RG "$KV" AZ-APP-RG
          if [[ -n "${SLOT_NAME_OVERRIDE}" ]]; then
            # A workflow input, not a secret -- deliberately NOT masked. Slot
            # names are ordinary words ("development"), and masking one would
            # redact every occurrence of it across the whole job's logs.
            echo "SLOT_NAME=${SLOT_NAME_OVERRIDE}" >> "$GITHUB_ENV"
          elif ! kv_to_env SLOT_NAME "$KV" SLOT-NAME; then
            echo "Cannot deploy to slot without SLOT-NAME." >&2
            exit 1
          fi

      - name: Enable GHA runner access
        run: |
          ./ops/scripts/pipeline/dev-add-allowed-ip.sh \
          -g ${{ env.AZ_APP_RG }} \
          -s ${{ env.stackName }} \
          -p ${{ env.priority }} \
          --slot-name ${{ env.SLOT_NAME }} \
          --is-cicd

      - name: Health check App Resources
        run: |
          ./ops/scripts/pipeline/endpoint-test.sh \
          --apiFunctionName ${{ inputs.apiFunctionName }} \
          --webappName ${{ inputs.webappName }} \
          --gitSha ${{ github.sha }} \
          --slotName ${{ env.SLOT_NAME }} \
          --resourceGroup ${{ env.AZ_APP_RG }}

      - name: Disable GHA runner access
        if: always()
        run: |
          name="gha-${{ env.priority }}-${{ env.stackName }}"
          ./ops/scripts/pipeline/dev-rm-allowed-ip.sh \
          -g ${{ env.AZ_APP_RG }} \
          -s ${{ env.stackName }} \
          -r ${name:0:32} \
          --slot-name ${{ env.SLOT_NAME }}
